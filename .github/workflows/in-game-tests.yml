name: Real Minecraft GameTests
on:
  push:
    branches: [main, feature/sanctuary-chronicles-v1-0-58]
  workflow_dispatch:
concurrency:
  group: shattered-seals-real-minecraft-tests
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  integration:
    name: Headless NeoForge in-game structure and loot tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Generate six dungeon NBT templates
        run: |
          python3 scripts/generate_dungeons.py
          python3 scripts/generate_v158_assets.py
          python3 scripts/generate_soundtrack.py
      - name: Launch real NeoForge GameTestServer and validate world behavior
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon runGameTestServer --stacktrace 2>&1 | tee real-minecraft-test-log.txt
      - name: Verify all expected tests truly ran
        run: python3 scripts/verify_gametest_results.py real-minecraft-test-log.txt
      - name: Upload GameTest logs and crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Shattered-Seals-Real-Minecraft-GameTests
          path: |
            real-minecraft-test-log.txt
            game-test-summary.txt
            run/logs/*.log
            run/crash-reports/*
          if-no-files-found: warn

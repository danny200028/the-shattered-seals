name: Build The Shattered Seals 1.0.50
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: shattered-seals-neoforge-main
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: NeoForge 1.21.1 Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify tracked NeoForge source
        run: |
          test -f build.gradle
          test -f scripts/preflight.py
          test -f src/main/java/com/shatteredseals/client/SkillTreeScreen.java
          test -f src/main/resources/data/shatteredseals/function/mastery/shop.mcfunction
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Generate six natural dungeons
        run: python3 scripts/generate_dungeons.py
      - name: RPG regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Preflight validation
        run: python3 scripts/preflight.py
      - name: Compile official NeoForge mod
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon build --stacktrace 2>&1 | tee compile-log.txt
      - name: Package CurseForge import ZIP
        run: python3 scripts/package_curseforge.py
      - name: Validate packaged modpack
        run: python3 -m unittest discover -s tests -p 'verify_package.py' -v
      - name: Upload CurseForge modpack
        uses: actions/upload-artifact@v4
        with:
          name: Shattered-Seals-1.0.50-CurseForge-Modpack
          path: |
            build/distributions/*.zip
            build/distributions/*.sha256
          if-no-files-found: error
      - name: Record output hashes
        if: success()
        run: sha256sum build/libs/*.jar > SHA256SUMS.txt
      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Shattered-Seals-1.0.50-NeoForge-JAR
          path: |
            build/libs/*.jar
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Shattered-Seals-1.0.50-Build-Log
          path: compile-log.txt
          if-no-files-found: ignore

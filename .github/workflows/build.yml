name: Build The Shattered Seals 1.1.0
on:
  push:
    branches: [main, fix/final-release-blockers]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: shattered-seals-neoforge-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: NeoForge 1.21.1 Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify tracked NeoForge source
        run: |
          test -f build.gradle
          test -f scripts/preflight.py
          test -f src/main/java/com/shatteredseals/client/SkillTreeScreen.java
          test -f src/main/resources/data/shatteredseals/function/mastery/shop.mcfunction
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Install Ogg Vorbis encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate six natural dungeons
        run: |
          python3 scripts/generate_dungeons.py
          python3 scripts/generate_v158_assets.py
          python3 scripts/generate_visual_identity.py
          python3 scripts/generate_soundtrack.py
      - name: RPG regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Preflight validation
        run: python3 scripts/preflight.py
      - name: Compile official NeoForge mod
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon build --stacktrace 2>&1 | tee compile-log.txt
      - name: Verify Minecraft GameTests for release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon runGameTestServer --stacktrace 2>&1 | tee real-minecraft-test-log.txt
          python3 scripts/verify_gametest_results.py real-minecraft-test-log.txt
      - name: Package CurseForge import ZIP
        run: python3 scripts/package_curseforge.py
      - name: Validate packaged modpack
        run: python3 -m unittest discover -s tests -p 'verify_package.py' -v
      - name: Upload CurseForge modpack
        uses: actions/upload-artifact@v4
        with:
          name: Shattered-Seals-1.1.0-Clean-CurseForge-Modpack
          path: |
            build/distributions/*.zip
            build/distributions/*.sha256
            build/distributions/*Cover.png
          if-no-files-found: error
      - name: Record output hashes
        if: success()
        run: sha256sum build/libs/*.jar > SHA256SUMS.txt
      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Shattered-Seals-1.1.0-NeoForge-JAR
          path: |
            build/libs/*.jar
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Shattered-Seals-1.1.0-Build-Log
          path: compile-log.txt
          if-no-files-found: ignore
  release:
    name: Publish v1.1.0
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Shattered-Seals-1.1.0-Clean-CurseForge-Modpack
          path: release/pack
      - uses: actions/download-artifact@v4
        with:
          name: Shattered-Seals-1.1.0-NeoForge-JAR
          path: release/mod
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq "version = '1.1.0'" build.gradle || exit 0
          if gh release view v1.1.0 >/dev/null 2>&1; then
            exit 0
          fi
          (cd release/pack && sha256sum -c The-Shattered-Seals-1.1.0-CurseForge.zip.sha256)
          (cd release/mod && sha256sum -c SHA256SUMS.txt)
          gh release create v1.1.0 \
            release/pack/The-Shattered-Seals-1.1.0-CurseForge.zip \
            release/pack/The-Shattered-Seals-1.1.0-CurseForge.zip.sha256 \
            release/pack/The-Shattered-Seals-1.1.0-CurseForge-Cover.png \
            release/mod/build/libs/the-shattered-seals-1.1.0.jar \
            release/mod/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "The Shattered Seals v1.1.0" \
            --notes-file docs/RELEASE_1.1.0.md --latest

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.59'
group = 'com.shatteredseals'
base { archivesName = 'the-shattered-seals' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

repositories {
    maven {
        name = 'Forge Maven (TerraBlender)'
        url = uri('https://maven.minecraftforge.net')
    }
}

dependencies {
    implementation 'com.github.glitchfiend:TerraBlender-neoforge:1.21.1-4.1.0.8'
}

neoForge {
    version = '21.1.238'
    mods { shatteredseals { sourceSet(sourceSets.main) } }
    runs {
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'shatteredseals'
        }
    }
}
